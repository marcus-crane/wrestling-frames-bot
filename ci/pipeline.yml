resources:
  - name: repo
    type: git
    source:
      uri: https://github.com/marcus-crane/wrestling-frames-bot.git
      branch: main
      username: ((github-token.username))
      password: ((github-token.password))

  - name: image
    type: registry-image
    source:
      repository: ghcr.io/marcus-crane/wrestling-frames-bot
      tag: latest
      username: ((github-token.username))
      password: ((github-token.password))

  - name: schedule
    type: time
    source:
      interval: 1h

  - name: site
    type: git
    source:
      uri: https://github.com/marcus-crane/wrestling-frames.git
      branch: main
      username: ((github-token.username))
      password: ((github-token.password))
      git_config:
        - name: user.name
          value: Wrestling Frame Bot
        - name: user.email
          value: helper@utf9k.net

jobs:
  - name: set-pipeline
    plan:
      - get: repo
        trigger: true
      - set_pipeline: self
        file: repo/ci/pipeline.yml

  - name: build-image
    plan:
      - get: repo
        trigger: true
      - task: build
        privileged: true
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: concourse/oci-build-task
          inputs:
            - name: repo
              path: .
          outputs:
            - name: image
          caches:
            - path: cache
          params:
            IMAGE_PLATFORM: linux/amd64
            BUILDKIT_CACHE_DIR: cache
          run:
            path: build
      - put: image
        params:
          image: image/image.tar

  - name: wrestling-frames
    public: false
    plan:
      - get: schedule
        trigger: true
      - get: site
      - task: run-bot
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: kroniak/ssh-client
          outputs:
            - name: frame-output
          params:
            SSH_PRIVATE_KEY: ((netcafe-ssh.private_key))
            SSH_HOST: ((netcafe-ssh.host))
            PLEX_URL: ((plex_url))
            PLEX_TOKEN: ((plex_token))
            PLEX_PPV_LIBRARY: Wrestling (PPVs)
            PLEX_TV_LIBRARY: Wrestling (TV)
            TV_SHOW_FILTERS: Raw,SmackDown
            PPV_WEIGHT: "0.25"
            BSKY_HANDLE: wrestlingframes.utf9k.net
            BSKY_PASSWORD: ((bsky_password))
            ANTHROPIC_API_KEY: ((anthropic_api_key))
          run:
            path: sh
            args:
              - -exc
              - |
                mkdir -p ~/.ssh
                echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
                chmod 600 ~/.ssh/id_ed25519
                ssh-keyscan "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

                ssh marcus@"$SSH_HOST" rm -rf /tmp/wrestling-frames
                ssh marcus@"$SSH_HOST" mkdir -p /tmp/wrestling-frames

                ssh marcus@"$SSH_HOST" "docker run --rm --pull always \
                  --user \$(id -u):\$(id -g) \
                  --device /dev/dri:/dev/dri \
                  -v /tmp/wrestling-frames:/tmp/wrestling-frames \
                  -e 'PLEX_URL=$PLEX_URL' \
                  -e 'PLEX_TOKEN=$PLEX_TOKEN' \
                  -e 'PLEX_PPV_LIBRARY=$PLEX_PPV_LIBRARY' \
                  -e 'PLEX_TV_LIBRARY=$PLEX_TV_LIBRARY' \
                  -e 'TV_SHOW_FILTERS=$TV_SHOW_FILTERS' \
                  -e 'PPV_WEIGHT=$PPV_WEIGHT' \
                  -e 'BSKY_HANDLE=$BSKY_HANDLE' \
                  -e 'BSKY_PASSWORD=$BSKY_PASSWORD' \
                  -e 'ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY' \
                  -e HUGO_SITE_PATH=/tmp/wrestling-frames \
                  ghcr.io/marcus-crane/wrestling-frames-bot:latest \
                  python wrestling_frame_bot.py"

                scp -r marcus@"$SSH_HOST":/tmp/wrestling-frames/content frame-output/

      - task: merge-frame
        config:
          platform: linux
          image_resource:
            type: registry-image
            source:
              repository: alpine
          inputs:
            - name: site
            - name: frame-output
          outputs:
            - name: site
          run:
            path: sh
            args:
              - -c
              - cp -r frame-output/content/frames/* site/content/frames/

      - put: site
        params:
          repository: site
          rebase: true
